<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Robot Control Panel</title>

<style>
body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    background:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

.control-pad{
    display:grid;
    grid-template-columns:repeat(3,120px);
    grid-template-rows:repeat(3,70px);
    gap:20px;
    justify-items:center;
    align-items:center;
}

.btn{
    width:100%;
    height:100%;
    border:2px solid #ccc;
    border-radius:12px;
    background:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    background:#f5f5f5;
}

.stop{
    border-color:red;
}

.forward{grid-column:2;grid-row:1;}
.left{grid-column:1;grid-row:2;}
.stop{grid-column:2;grid-row:2;}
.right{grid-column:3;grid-row:2;}
.backward{grid-column:2;grid-row:3;}

#status{
    margin-top:25px;
    font-size:16px;
}

.voice-box{
    margin-top:45px;
    width:420px;
    text-align:center;
}

.voice-box h2{
    margin-bottom:15px;
}

.voice-btn{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#007bff;
    color:white;
}

.voice-btn:hover{
    background:#0056b3;
}

textarea{
    width:100%;
    height:90px;
    margin-top:20px;
    padding:10px;
    font-size:16px;
    resize:none;
}

#voiceStatus{
    margin-top:15px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="control-pad">

<button class="btn forward" onclick="sendCommand('forward')">Forward</button>

<button class="btn left" onclick="sendCommand('left')">Left</button>

<button class="btn stop" onclick="sendCommand('stop')">Stop</button>

<button class="btn right" onclick="sendCommand('right')">Right</button>

<button class="btn backward" onclick="sendCommand('backward')">Backward</button>

</div>

<div id="status">Ready</div>

<div class="voice-box">

<h2>Voice Control</h2>

<button class="voice-btn" onclick="startVoice()">
🎤 Start Recording
</button>

<textarea
id="speechText"
readonly
placeholder="Recognized speech will appear here..."></textarea>

<div id="voiceStatus"></div>

</div>

<script>

function sendCommand(cmd){

document.getElementById("status").innerText="Sending...";

fetch("update_command.php",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:"command="+encodeURIComponent(cmd)

})

.then(res=>res.json())

.then(data=>{

if(data.status==="success"){

document.getElementById("status").innerText=
"Command Sent : "+data.button;

}
else{

document.getElementById("status").innerText=data.message;

}

})

.catch(()=>{

document.getElementById("status").innerText=
"Server Error";

});

}



function startVoice(){

if(!('webkitSpeechRecognition' in window)){

alert("Speech Recognition is not supported in this browser.");

return;

}

const recognition=new webkitSpeechRecognition();

recognition.lang="en-US";

recognition.interimResults=false;

recognition.maxAlternatives=1;

document.getElementById("voiceStatus").innerText="Listening...";

recognition.start();

recognition.onresult=function(event){

const text=event.results[0][0].transcript;

document.getElementById("speechText").value=text;

fetch("voice_command.php",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:"text="+encodeURIComponent(text)

})

.then(res=>res.json())

.then(data=>{

if(data.status==="success"){

document.getElementById("voiceStatus").innerHTML=
"✅ Command Detected: <b>"+data.command+"</b>";

}
else{

document.getElementById("voiceStatus").innerHTML=
"❌ "+data.message;

}

});

};

recognition.onerror=function(){

document.getElementById("voiceStatus").innerText=
"Recognition Failed.";

};

}

</script>

</body>
</html>
